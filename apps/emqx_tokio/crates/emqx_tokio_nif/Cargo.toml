[package]
name = "emqx-tokio-nif"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "emqx_tokio_nif"
crate-type = ["cdylib"]

[dependencies]
redis = { version = "1.0.4", features = ["tokio-comp", "connection-manager"] }
rustler = "=0.37.0"
tokio = { version = "1", features = ["full"] }
bytes = "1"
parking_lot = "0.12"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
